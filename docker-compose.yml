version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kloudi-postgres-dev
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: kloudi
      POSTGRES_PASSWORD: kloudi_dev_password
      POSTGRES_DB: kloudi_dev
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kloudi']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kloudi-redis-dev
    ports:
      - '6379:6379'
    volumes:
      - redis-dev-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-dev-data:
  redis-dev-data:
