# Test Environment (NODE_ENV=test)
#
# Overrides default.yml for test runs. Committed to git.
# Uses separate database/redis ports to avoid conflicting with dev.

# Database
database:
  url: "postgresql://kloudi_test:kloudi_test_password@localhost:5433/kloudi_test"
  maxConnections: 10
  connectionTimeout: 5000

# Cache (Redis)
cache:
  type: "redis"
  redisUrl: "redis://localhost:6380"
  defaultTtl: 300

# Authentication
auth:
  jwtSecret: "test_jwt_secret_key_for_testing_only_not_for_production"
  jwtExpiresIn: "15m"
  bcryptRounds: 10

# Environment
environment:
  nodeEnv: "test"
  logLevel: "error"

# Events
events:
  enabled: true
  retryAttempts: 3

# Application
application:
  port: 3002
  host: "localhost"

# CORS
cors:
  allowedOrigins: "http://localhost:3000,http://localhost:3002"
  allowedMethods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  allowedHeaders: "Content-Type,Authorization,X-Requested-With"
  allowCredentials: true
