# Environment Variable → Config Key Mappings (highest priority)
#
# Maps env var names to config keys. When an env var is set (via .env or shell),
# its value overrides ALL yaml files. This is how secrets flow into config.
# Committed to git — it defines the contract, not the values.

# AI Service Variables
ai:
  apiKeys:
    openai: 'OPENAI_API_KEY'
    anthropic: 'ANTHROPIC_API_KEY'
    azure: 'AZURE_OPENAI_API_KEY'
    google: 'GOOGLE_AI_API_KEY'

  endpoints:
    openai: 'OPENAI_API_BASE_URL'
    azure: 'AZURE_OPENAI_ENDPOINT'

  models:
    defaultModel: 'AI_DEFAULT_MODEL'
    fallbackModel: 'AI_FALLBACK_MODEL'

# Database Variables
database:
  url: 'DATABASE_URL'
  maxConnections: 'DATABASE_MAX_CONNECTIONS'
  connectionTimeout: 'DATABASE_CONNECTION_TIMEOUT'
  ssl: 'DB_SSL_ENABLED'

# Cache Variables
cache:
  type: 'CACHE_TYPE'
  redisUrl: 'REDIS_URL'
  defaultTtl: 'CACHE_DEFAULT_TTL'
  maxMemory: 'CACHE_MAX_MEMORY'

# Authentication Variables
auth:
  jwtSecret: 'JWT_SECRET'
  jwtExpiresIn: 'JWT_EXPIRES_IN'
  bcryptRounds: 'BCRYPT_ROUNDS'
  sessionSecret: 'SESSION_SECRET'

# Environment Variables
environment:
  nodeEnv: 'NODE_ENV'
  logLevel: 'LOG_LEVEL'

# Event System Variables
events:
  enabled: 'EVENTS_ENABLED'
  retryAttempts: 'EVENTS_RETRY_ATTEMPTS'

# Application Variables
application:
  port: 'PORT'
  host: 'HOST'

# CORS Variables
cors:
  allowedOrigins: 'CORS_ALLOWED_ORIGINS'
  allowedMethods: 'CORS_ALLOWED_METHODS'
  allowedHeaders: 'CORS_ALLOWED_HEADERS'
  allowCredentials: 'CORS_ALLOW_CREDENTIALS'

# Third-party Service Variables
services:
  stripe:
    secretKey: 'STRIPE_SECRET_KEY'
    webhookSecret: 'STRIPE_WEBHOOK_SECRET'

  aws:
    accessKeyId: 'AWS_ACCESS_KEY_ID'
    secretAccessKey: 'AWS_SECRET_ACCESS_KEY'
    region: 'AWS_REGION'

  sendgrid:
    apiKey: 'SENDGRID_API_KEY'
