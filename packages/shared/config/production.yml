# Production Environment (NODE_ENV=production)
#
# Overrides default.yml for production. Committed to git.
# All secrets MUST come from environment variables, never hardcoded here.

database:
  # URL comes from environment variable DATABASE_URL
  maxConnections: 50
  connectionTimeout: 60000

cache:
  type: 'redis'
  # redisUrl comes from environment variable REDIS_URL
  defaultTtl: 7200 # 2 hours

auth:
  # jwtSecret MUST come from environment variable JWT_SECRET
  jwtExpiresIn: '24h'
  bcryptRounds: 14 # Higher security for production

environment:
  logLevel: 'warn' # Less verbose in production

events:
  retryAttempts: 5 # More retries in production

application:
  port: 8080

# AI Configuration for Production
ai:
  # Production-specific overrides
  # Inherits defaults, only override what's different

  domains:
    default:
      # Use production defaults from default.yml
      # Override specific settings here if needed

    development:
      # Internal development assistance - cost-effective
      provider: 'anthropic'
      model: 'claude-3-haiku-20240307'
      temperature: 0.5

