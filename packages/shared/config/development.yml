# Development Environment (NODE_ENV=development)
#
# Overrides default.yml for local development. Committed to git.
# Secrets (DATABASE_URL, JWT_SECRET, etc.) belong in .env, not here.

database:
  maxConnections: 5

cache:
  type: "redis"
  defaultTtl: 1800

auth:
  jwtExpiresIn: "12h"
  bcryptRounds: 10

environment:
  nodeEnv: "development"
  logLevel: "debug"

application:
  port: 3001
  host: "localhost"

ai:
  model: "gpt-3.5-turbo"
  temperature: 0.8

  domains:
    default:
      model: "gpt-3.5-turbo"
      temperature: 0.8