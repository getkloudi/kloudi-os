services:
  - type: web
    runtime: docker
    name: kloudi-api
    repo: https://github.com/nitishMehrotra/kloudi-os
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: ANTHROPIC_API_KEY
        sync: false
